spring.application.name=library-management

# Everything else (DataSource, Hibernate, Tomcat, Jackson ...) is auto-configured by Spring Boot.
# Hosting platforms provide the port in the PORT variable; locally it falls back to 8080.
server.port=${PORT:8080}
server.max-http-request-header-size=32KB

# Fixed DB name so the H2 console URL is predictable.
spring.datasource.url=jdbc:h2:mem:librarydb
# Console is on locally; the Dockerfile turns it off for public deployment.
spring.h2.console.enabled=${H2_CONSOLE:true}

# Show the SQL that the Repository layer generates (useful for the demo)
spring.jpa.show-sql=true
